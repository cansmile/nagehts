<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Feinstaub (Fine Dust / PM2.5) -->
  <rect x="0" y="0" width="200" height="200" fill="#d5dce4" rx="12"/>
  <!-- City skyline faded -->
  <rect x="20" y="100" width="25" height="80" fill="#b0b8c0" opacity="0.5"/>
  <rect x="50" y="80" width="20" height="100" fill="#a0a8b0" opacity="0.5"/>
  <rect x="75" y="110" width="30" height="70" fill="#b0b8c0" opacity="0.5"/>
  <rect x="110" y="90" width="22" height="90" fill="#a0a8b0" opacity="0.5"/>
  <rect x="140" y="105" width="35" height="75" fill="#b0b8c0" opacity="0.5"/>
  <!-- Warning triangle -->
  <path d="M100 30 L140 95 L60 95 Z" fill="#f39c12" stroke="#e67e22" stroke-width="2.5"/>
  <path d="M100 42 L130 88 L70 88 Z" fill="#f1c40f"/>
  <!-- Exclamation mark -->
  <rect x="96" y="52" width="8" height="22" fill="#333" rx="2"/>
  <circle cx="100" cy="82" r="4.5" fill="#333"/>
  <!-- Dust particles scattered -->
  <circle cx="30" cy="50" r="3" fill="#999" opacity="0.6"/>
  <circle cx="55" cy="35" r="2" fill="#888" opacity="0.5"/>
  <circle cx="150" cy="45" r="3.5" fill="#999" opacity="0.6"/>
  <circle cx="170" cy="65" r="2.5" fill="#888" opacity="0.5"/>
  <circle cx="25" cy="130" r="2" fill="#aaa" opacity="0.4"/>
  <circle cx="160" cy="120" r="2.5" fill="#aaa" opacity="0.4"/>
  <circle cx="45" cy="70" r="1.5" fill="#999" opacity="0.5"/>
  <circle cx="165" cy="30" r="2" fill="#888" opacity="0.5"/>
  <circle cx="80" cy="25" r="1.5" fill="#999" opacity="0.4"/>
  <circle cx="130" cy="60" r="2" fill="#888" opacity="0.5"/>
  <circle cx="15" cy="90" r="2.5" fill="#999" opacity="0.4"/>
  <circle cx="185" cy="90" r="2" fill="#888" opacity="0.4"/>
  <!-- Haze overlay -->
  <rect x="0" y="100" width="200" height="100" fill="#c0c8d0" opacity="0.3" rx="0"/>
  <!-- Text PM2.5 -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#555" opacity="0.7">PM 2.5</text>
</svg>

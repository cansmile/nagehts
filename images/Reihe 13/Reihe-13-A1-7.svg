<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- COVID-19 (Coronavirus) -->
  <rect x="0" y="0" width="200" height="200" fill="#c0392b" rx="12"/>
  <!-- Virus body -->
  <circle cx="100" cy="100" r="40" fill="#e8e8e8" opacity="0.9"/>
  <!-- Spike proteins -->
  <g fill="#d5d5d5" stroke="#bbb" stroke-width="0.5">
    <line x1="100" y1="100" x2="100" y2="42" stroke="#ccc" stroke-width="2"/>
    <circle cx="100" cy="40" r="6"/>
    <line x1="100" y1="100" x2="100" y2="158" stroke="#ccc" stroke-width="2"/>
    <circle cx="100" cy="160" r="6"/>
    <line x1="100" y1="100" x2="158" y2="100" stroke="#ccc" stroke-width="2"/>
    <circle cx="160" cy="100" r="6"/>
    <line x1="100" y1="100" x2="42" y2="100" stroke="#ccc" stroke-width="2"/>
    <circle cx="40" cy="100" r="6"/>
    <!-- Diagonal spikes -->
    <line x1="100" y1="100" x2="141" y2="59" stroke="#ccc" stroke-width="2"/>
    <circle cx="143" cy="57" r="6"/>
    <line x1="100" y1="100" x2="59" y2="59" stroke="#ccc" stroke-width="2"/>
    <circle cx="57" cy="57" r="6"/>
    <line x1="100" y1="100" x2="141" y2="141" stroke="#ccc" stroke-width="2"/>
    <circle cx="143" cy="143" r="6"/>
    <line x1="100" y1="100" x2="59" y2="141" stroke="#ccc" stroke-width="2"/>
    <circle cx="57" cy="143" r="6"/>
    <!-- Extra spikes -->
    <line x1="100" y1="100" x2="120" y2="45" stroke="#ccc" stroke-width="1.5"/>
    <circle cx="121" cy="43" r="5"/>
    <line x1="100" y1="100" x2="80" y2="45" stroke="#ccc" stroke-width="1.5"/>
    <circle cx="79" cy="43" r="5"/>
    <line x1="100" y1="100" x2="155" y2="80" stroke="#ccc" stroke-width="1.5"/>
    <circle cx="157" cy="79" r="5"/>
    <line x1="100" y1="100" x2="155" y2="120" stroke="#ccc" stroke-width="1.5"/>
    <circle cx="157" cy="121" r="5"/>
  </g>
  <!-- Dots on virus surface -->
  <circle cx="88" cy="88" r="5" fill="#c0392b" opacity="0.5"/>
  <circle cx="112" cy="92" r="4" fill="#c0392b" opacity="0.5"/>
  <circle cx="95" cy="108" r="5" fill="#c0392b" opacity="0.5"/>
  <circle cx="110" cy="112" r="4" fill="#c0392b" opacity="0.5"/>
  <!-- Small floating viruses -->
  <circle cx="25" cy="30" r="10" fill="#e8e8e8" opacity="0.3"/>
  <circle cx="175" cy="170" r="12" fill="#e8e8e8" opacity="0.3"/>
  <circle cx="170" cy="35" r="8" fill="#e8e8e8" opacity="0.25"/>
  <circle cx="30" cy="165" r="9" fill="#e8e8e8" opacity="0.25"/>
</svg>

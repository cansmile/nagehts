<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gelber Sand (Yellow Sand / Dust Storm) -->
  <defs>
    <linearGradient id="sandsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a44a"/>
      <stop offset="100%" stop-color="#c49032"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="url(#sandsky)" rx="12"/>
  <!-- Hazy city silhouette -->
  <rect x="15" y="110" width="22" height="70" fill="#a07828" opacity="0.4"/>
  <rect x="42" y="90" width="18" height="90" fill="#a07828" opacity="0.35"/>
  <rect x="65" y="100" width="28" height="80" fill="#a07828" opacity="0.4"/>
  <rect x="98" y="85" width="15" height="95" fill="#a07828" opacity="0.35"/>
  <rect x="118" y="95" width="25" height="85" fill="#a07828" opacity="0.4"/>
  <rect x="150" y="105" width="20" height="75" fill="#a07828" opacity="0.35"/>
  <rect x="175" y="110" width="18" height="70" fill="#a07828" opacity="0.4"/>
  <!-- Sand particles (many) -->
  <circle cx="20" cy="30" r="2" fill="#e8c55a" opacity="0.7"/>
  <circle cx="50" cy="45" r="1.5" fill="#d4a44a" opacity="0.6"/>
  <circle cx="80" cy="25" r="2.5" fill="#e8c55a" opacity="0.7"/>
  <circle cx="120" cy="35" r="2" fill="#d4a44a" opacity="0.6"/>
  <circle cx="155" cy="20" r="1.5" fill="#e8c55a" opacity="0.7"/>
  <circle cx="180" cy="50" r="2" fill="#d4a44a" opacity="0.6"/>
  <circle cx="35" cy="65" r="2" fill="#e8c55a" opacity="0.5"/>
  <circle cx="100" cy="55" r="1.5" fill="#d4a44a" opacity="0.5"/>
  <circle cx="140" cy="70" r="2.5" fill="#e8c55a" opacity="0.5"/>
  <circle cx="170" cy="80" r="2" fill="#d4a44a" opacity="0.5"/>
  <circle cx="60" cy="78" r="1.5" fill="#e8c55a" opacity="0.5"/>
  <!-- People silhouettes (small) -->
  <g fill="#8a6820" opacity="0.5">
    <!-- Person 1 -->
    <circle cx="70" cy="160" r="4"/>
    <rect x="67" y="164" width="6" height="12" rx="2"/>
    <!-- Person 2 with umbrella -->
    <circle cx="130" cy="158" r="4"/>
    <rect x="127" y="162" width="6" height="14" rx="2"/>
    <line x1="130" y1="148" x2="130" y2="158" stroke="#8a6820" stroke-width="1.5"/>
    <path d="M118 148 Q130 140 142 148" fill="#8a6820"/>
  </g>
  <!-- Sun barely visible -->
  <circle cx="160" cy="40" r="20" fill="#e8c55a" opacity="0.4"/>
  <!-- Ground -->
  <rect x="0" y="175" width="200" height="25" fill="#b8922e" opacity="0.5" rx="0"/>
</svg>

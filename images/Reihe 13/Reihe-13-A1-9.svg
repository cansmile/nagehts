<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Tierquälerei (Animal Cruelty) -->
  <rect x="0" y="0" width="200" height="200" fill="#bdc3c7" rx="12"/>
  <!-- Cage bars -->
  <g stroke="#8b6914" stroke-width="5" stroke-linecap="round">
    <line x1="25" y1="20" x2="25" y2="180"/>
    <line x1="50" y1="20" x2="50" y2="180"/>
    <line x1="75" y1="20" x2="75" y2="180"/>
    <line x1="100" y1="20" x2="100" y2="180"/>
    <line x1="125" y1="20" x2="125" y2="180"/>
    <line x1="150" y1="20" x2="150" y2="180"/>
    <line x1="175" y1="20" x2="175" y2="180"/>
  </g>
  <!-- Horizontal bars -->
  <g stroke="#8b6914" stroke-width="4">
    <line x1="20" y1="25" x2="180" y2="25"/>
    <line x1="20" y1="175" x2="180" y2="175"/>
  </g>
  <!-- Dog body (sad, behind bars) -->
  <g opacity="0.9">
    <!-- Body -->
    <ellipse cx="100" cy="130" rx="30" ry="22" fill="#c9a06c"/>
    <!-- Head -->
    <circle cx="100" cy="95" r="22" fill="#d4b896"/>
    <!-- Ears (floppy, sad) -->
    <ellipse cx="78" cy="85" rx="10" ry="14" fill="#b8956e" transform="rotate(-15 78 85)"/>
    <ellipse cx="122" cy="85" rx="10" ry="14" fill="#b8956e" transform="rotate(15 122 85)"/>
    <!-- Eyes (sad) -->
    <circle cx="91" cy="92" r="4" fill="#fff"/>
    <circle cx="109" cy="92" r="4" fill="#fff"/>
    <circle cx="91" cy="93" r="2.5" fill="#333"/>
    <circle cx="109" cy="93" r="2.5" fill="#333"/>
    <!-- Sad eyebrows (drooping inward) -->
    <line x1="85" y1="84" x2="95" y2="86" stroke="#8b6e4e" stroke-width="2" stroke-linecap="round"/>
    <line x1="115" y1="84" x2="105" y2="86" stroke="#8b6e4e" stroke-width="2" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="100" cy="100" rx="5" ry="3.5" fill="#333"/>
    <!-- Sad mouth -->
    <path d="M92 107 Q100 102 108 107" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Front paws on bar -->
    <ellipse cx="85" cy="152" rx="8" ry="5" fill="#d4b896"/>
    <ellipse cx="115" cy="152" rx="8" ry="5" fill="#d4b896"/>
    <!-- Paw pads -->
    <ellipse cx="83" cy="155" rx="2" ry="1.5" fill="#b8956e"/>
    <ellipse cx="87" cy="155" rx="2" ry="1.5" fill="#b8956e"/>
    <ellipse cx="113" cy="155" rx="2" ry="1.5" fill="#b8956e"/>
    <ellipse cx="117" cy="155" rx="2" ry="1.5" fill="#b8956e"/>
  </g>
  <!-- Tear drop -->
  <path d="M112 97 Q114 102 112 106 Q110 102 112 97" fill="#5dade2" opacity="0.7"/>
</svg>
